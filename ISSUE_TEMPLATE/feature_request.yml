name: Feature Request
description: Suggest an idea for this project
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of what you want to happen.
      placeholder: Add custom sound effects when...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Minecraft / Plugin Version
      description: Which version are you running?
      placeholder: e.g., 0.1 (Paper 1.21.1)
    validations:
      required: true
